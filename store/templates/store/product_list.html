{% extends 'store/base.html' %}
{% block content %}
  <h2>Browse Our Products</h2>
  <div class="product-grid">
    {% for p in products %}
      <div class="product-card">
        <a href="{% url 'store:product_detail' p.pk %}">{{ p.name }}</a>
        <p style="color: #666; font-size: 0.95rem; margin: 0.5rem 0;">{{ p.description }}</p>
        <div class="product-price">${{ p.price }}</div>
        <form action="{% url 'store:add_to_cart' p.pk %}" method="post" style="margin-top: 1rem;">
          {% csrf_token %}
          <button type="submit" class="btn">Add to Cart</button>
        </form>
      </div>
    {% empty %}
      <div class="empty-message">No products available.</div>
    {% endfor %}
  </div>
{% endblock %}
